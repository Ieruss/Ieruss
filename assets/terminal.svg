<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title description">
  <title id="title">Ruslan's animated developer terminal</title>
  <desc id="description">An animated terminal introducing Ruslan as a backend developer from Kazakhstan.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f81f7" />
      <stop offset="0.55" stop-color="#8957e5" />
      <stop offset="1" stop-color="#39d353" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#010409" flood-opacity="0.55" />
    </filter>
    <clipPath id="line1"><rect x="42" y="75" width="0" height="24"><animate attributeName="width" from="0" to="640" dur="1.4s" begin="0.4s" fill="freeze" /></rect></clipPath>
    <clipPath id="line2"><rect x="42" y="111" width="0" height="24"><animate attributeName="width" from="0" to="640" dur="1.35s" begin="1.8s" fill="freeze" /></rect></clipPath>
    <clipPath id="line3"><rect x="42" y="147" width="0" height="24"><animate attributeName="width" from="0" to="640" dur="1.5s" begin="3.15s" fill="freeze" /></rect></clipPath>
    <clipPath id="line4"><rect x="42" y="183" width="0" height="24"><animate attributeName="width" from="0" to="640" dur="1.55s" begin="4.65s" fill="freeze" /></rect></clipPath>
  </defs>

  <rect x="5" y="5" width="750" height="270" rx="15" fill="url(#border)" filter="url(#shadow)" />
  <rect x="7" y="7" width="746" height="266" rx="13" fill="url(#panel)" />
  <path d="M7 48H753" stroke="#30363d" />

  <circle cx="28" cy="27" r="6" fill="#ff5f56" />
  <circle cx="49" cy="27" r="6" fill="#ffbd2e" />
  <circle cx="70" cy="27" r="6" fill="#27c93f" />
  <text x="380" y="32" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">ruslan@github: ~</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">
    <g clip-path="url(#line1)">
      <text x="42" y="91" fill="#39d353">ruslan@github</text><text x="163" y="91" fill="#8b949e">:</text><text x="173" y="91" fill="#58a6ff">~</text><text x="184" y="91" fill="#c9d1d9">$ whoami</text>
    </g>
    <g clip-path="url(#line2)">
      <text x="42" y="127" fill="#f0f6fc">Backend Developer</text><text x="195" y="127" fill="#8b949e"> · Kazakhstan</text>
    </g>
    <g clip-path="url(#line3)">
      <text x="42" y="163" fill="#39d353">ruslan@github</text><text x="163" y="163" fill="#8b949e">:</text><text x="173" y="163" fill="#58a6ff">~</text><text x="184" y="163" fill="#c9d1d9">$ stack --primary</text>
    </g>
    <g clip-path="url(#line4)">
      <text x="42" y="199" fill="#d2a8ff">Python</text><text x="101" y="199" fill="#8b949e"> | </text><text x="126" y="199" fill="#2f81f7">FastAPI</text><text x="194" y="199" fill="#8b949e"> | </text><text x="219" y="199" fill="#39d353">Django</text><text x="278" y="199" fill="#8b949e"> | </text><text x="303" y="199" fill="#58a6ff">PostgreSQL</text><text x="408" y="199" fill="#8b949e"> | </text><text x="433" y="199" fill="#79c0ff">Docker</text>
    </g>
    <text x="42" y="239" fill="#39d353">➜</text>
    <rect x="65" y="224" width="9" height="19" rx="1" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
